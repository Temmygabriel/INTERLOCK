# gltest configuration.
# Direct-mode tests (tests/direct) run with pytest + the gltest plugin and need no
# network. Integration tests run against a network via: gltest tests/integration -v -s
# studionet is preconfigured (hosted, gasless) — the default cloud target.
networks:
  default: studionet
  studionet:    # hosted GenLayer cloud; gasless, no GEN balance required
    leader_only: false

paths:
  contracts: contracts/
  artifacts: artifacts/
