  <rect x="8.6" y="13.4" width="14.8" height="13.6" rx="3" fill="#1D3557"/>
  <circle cx="16" cy="18.8" r="2.3" fill="#F4F7FA"/>
  <rect x="15" y="20.8" width="2" height="4.4" rx="1" fill="#F4F7FA"/>
</svg>
