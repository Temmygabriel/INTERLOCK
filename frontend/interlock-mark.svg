<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Interlock — a padlock whose shackle is the breaker arm">
  <!-- Interlock mark — v2 palette. Navy #1D3557 body on paper; hazard #D9A22C
       shackle reads as the switch arm (closed when running, lifted when tripped). -->
