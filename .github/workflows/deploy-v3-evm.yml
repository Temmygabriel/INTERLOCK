name: deploy-v3-evm

# Manual, on-demand deploy of the Interlock v3 EVM leg on testnets. This burns
# real (testnet) gas from the deployer wallet, so it is deliberately NOT wired
# to any push/PR trigger. One full run deploys a fresh set:
#
#   zkSync Era Sepolia  BridgeForwarder      (hub forwarder)
#   Base Sepolia        BaseTripDispatcher   (LZ V2 receiver)
#   Base Sepolia        BaseDemoVault        (toy victim, bridged by dispatcher)
#
# and then links them: dispatcher.trustedForwarder=forwarder,
# dispatcher.trustedTarget=vault, forwarder.bridgeAddresses[40245]=dispatcher.
#
# MODES
#   mode=deploy    (default) full fresh deploy + wiring, as above.
#   mode=configure skips the three deploy steps and replays ONLY the two wiring
#                  steps against already-deployed contracts supplied via
#                  forwarder_address / dispatcher_address / vault_address. Use
#                  this to finish or repair wiring after a deploy (e.g. a
#                  post-deploy RPC-lag read failed) without orphaning good
#                  contracts or spending more deploy gas.
#
# Secrets required (repo-level):
#   V3_DEPLOYER_KEY  deployer EOA privkey — funded on Base Sepolia + zkSync Sepolia
#   V3_RELAY_KEY     relay EOA privkey (only its ADDRESS is needed here: it is the
#                    forwarder's CALLER_ROLE holder for the later live run)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a live testnet run (burns gas)'
        required: true
        default: ''
      mode:
        description: 'deploy = fresh deploy + wiring | configure = wire existing contracts only'
        required: false
        default: 'deploy'
      forwarder_address:
        description: 'configure mode: existing zkSync BridgeForwarder address'
        required: false
        default: ''
      dispatcher_address:
        description: 'configure mode: existing BaseTripDispatcher address'
        required: false
        default: ''
      vault_address:
        description: 'configure mode: existing BaseDemoVault address'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # LayerZero V2 endpoints
  ZKSYNCSEPOLIATESTNET_ENDPOINT: "0xe2Ef622A13e71D9Dd2BBd12cd4b27e1516FA8a09"
  BASESEPOLIATESTNET_ENDPOINT: "0x6EDCE65403992e310A62460808c4b910D972f10f"
  # RPCs (public testnet endpoints)
  ZKSYNC_SEPOLIA_RPC_URL: https://sepolia.era.zksync.dev
  BASE_SEPOLIA_RPC_URL: https://sepolia.base.org

jobs:
  evm-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require explicit confirmation
        if: github.event.inputs.confirm != 'deploy'
        run: |
          echo "::error::You must re-run this workflow with the 'deploy' confirmation input. Nothing was deployed."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: interlock-v3-crosschain

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---- 0. Install deps for both Hardhat projects ----------------------
      - name: Install zkSync hub project deps
        working-directory: v3-crosschain/boilerplate/smart-contracts
        run: npm install --no-audit --no-fund

      - name: Install Base project deps
        working-directory: v3-crosschain/base
        run: npm install --no-audit --no-fund

      - name: Compile zkSync hub contracts (visible output)
        working-directory: v3-crosschain/boilerplate/smart-contracts
        run: npx hardhat compile

      - name: Compile Base contracts (visible output)
        working-directory: v3-crosschain/base
        run: npx hardhat compile

      # ---- 1. Derive public addresses from the two keys -------------------
      - name: Derive owner (deployer) + caller (relay) addresses
        working-directory: v3-crosschain/boilerplate/smart-contracts
        env:
          DEPLOYER_KEY: ${{ secrets.V3_DEPLOYER_KEY }}
          RELAY_KEY: ${{ secrets.V3_RELAY_KEY }}
        run: |
          set -euo pipefail
          OWNER_ADDRESS=$(node -e "const {Wallet}=require('ethers');const k=process.env.DEPLOYER_KEY.startsWith('0x')?process.env.DEPLOYER_KEY:'0x'+process.env.DEPLOYER_KEY;console.log(new Wallet(k).address)")
          CALLER_ADDRESS=$(node -e "const {Wallet}=require('ethers');const k=process.env.RELAY_KEY.startsWith('0x')?process.env.RELAY_KEY:'0x'+process.env.RELAY_KEY;console.log(new Wallet(k).address)")
          echo "OWNER_ADDRESS=$OWNER_ADDRESS" >> "$GITHUB_ENV"
          echo "CALLER_ADDRESS=$CALLER_ADDRESS" >> "$GITHUB_ENV"
          echo "owner=$OWNER_ADDRESS"
          echo "caller(relay)=$CALLER_ADDRESS"

      # ---- 2. zkSync Era Sepolia: BridgeForwarder -------------------------
      - name: Deploy BridgeForwarder (zkSync Sepolia)
        if: github.event.inputs.mode != 'configure'
        working-directory: v3-crosschain/boilerplate/smart-contracts
        env:
          PRIVATE_KEY: ${{ secrets.V3_DEPLOYER_KEY }}
        run: |
          # The runner launches every run: step with `bash -e`. That inherited
          # errexit would kill the script at the LOG=$(...) substitution below
          # (before st=$? / printf), silently hiding deploy errors. Cancel it.
          set +e
          set -uo pipefail
          LOG=$(CONTRACT=forwarder npx hardhat run scripts/deploy.ts --network zkSyncSepoliaTestnet 2>&1)
          st=$?
          printf '%s\n' "$LOG"
          FORWARDER=$(printf '%s' "$LOG" | grep -oE 'BridgeForwarder deployed to: 0x[0-9a-fA-F]{40}' | grep -oE '0x[0-9a-fA-F]{40}' | head -1 || true)
          if [ $st -ne 0 ] || [ -z "$FORWARDER" ]; then
            echo "::error::BridgeForwarder deploy failed (status=$st) or address not captured."
            exit 1
          fi
          echo "FORWARDER=$FORWARDER" >> "$GITHUB_ENV"
          echo "FORWARDER=$FORWARDER"

      # ---- 3. Base Sepolia: BaseTripDispatcher (trusts the forwarder) -----
      - name: Deploy BaseTripDispatcher (Base Sepolia)
        if: github.event.inputs.mode != 'configure'
        working-directory: v3-crosschain/base
        env:
          PRIVATE_KEY: ${{ secrets.V3_DEPLOYER_KEY }}
        run: |
          # The runner launches every run: step with `bash -e`. That inherited
          # errexit would kill the script at the LOG=$(...) substitution below
          # (before st=$? / printf), silently hiding deploy errors. Cancel it.
          set +e
          set -uo pipefail
          LOG=$(TRUSTED_FORWARDER_ADDRESS="$FORWARDER" \
            npx hardhat run scripts/deploy-dispatcher.js --network baseSepoliaTestnet 2>&1)
          st=$?
          printf '%s\n' "$LOG"
          DISPATCHER=$(printf '%s' "$LOG" | grep -oE 'BaseTripDispatcher deployed to: 0x[0-9a-fA-F]{40}' | grep -oE '0x[0-9a-fA-F]{40}' | head -1 || true)
          if [ $st -ne 0 ] || [ -z "$DISPATCHER" ]; then
            echo "::error::BaseTripDispatcher deploy failed (status=$st) or address not captured."
            exit 1
          fi
          echo "DISPATCHER=$DISPATCHER" >> "$GITHUB_ENV"
          echo "DISPATCHER=$DISPATCHER"

      # ---- 4. Base Sepolia: BaseDemoVault, bridged by the dispatcher ------
      - name: Deploy BaseDemoVault (Base Sepolia)
        if: github.event.inputs.mode != 'configure'
        working-directory: v3-crosschain/base
        env:
          PRIVATE_KEY: ${{ secrets.V3_DEPLOYER_KEY }}
        run: |
          # The runner launches every run: step with `bash -e`. That inherited
          # errexit would kill the script at the LOG=$(...) substitution below
          # (before st=$? / printf), silently hiding deploy errors. Cancel it.
          set +e
          set -uo pipefail
          LOG=$(BRIDGE_RECEIVER_ADDRESS="$DISPATCHER" \
            npx hardhat run scripts/deploy.js --network baseSepoliaTestnet 2>&1)
          st=$?
          printf '%s\n' "$LOG"
          VAULT=$(printf '%s' "$LOG" | grep -oE 'BaseDemoVault deployed to: 0x[0-9a-fA-F]{40}' | grep -oE '0x[0-9a-fA-F]{40}' | head -1 || true)
          if [ $st -ne 0 ] || [ -z "$VAULT" ]; then
            echo "::error::BaseDemoVault deploy failed (status=$st) or address not captured."
            exit 1
          fi
          echo "VAULT=$VAULT" >> "$GITHUB_ENV"
          echo "VAULT=$VAULT"

      # ---- 4b. Configure mode: seed the three addresses from inputs --------
      - name: Seed addresses (configure mode)
        if: github.event.inputs.mode == 'configure'
        env:
          IN_FORWARDER: ${{ github.event.inputs.forwarder_address }}
          IN_DISPATCHER: ${{ github.event.inputs.dispatcher_address }}
          IN_VAULT: ${{ github.event.inputs.vault_address }}
        run: |
          set -euo pipefail
          for pair in "FORWARDER:$IN_FORWARDER" "DISPATCHER:$IN_DISPATCHER" "VAULT:$IN_VAULT"; do
            name="${pair%%:*}"; val="${pair#*:}"
            if ! printf '%s' "$val" | grep -qE '^0x[0-9a-fA-F]{40}$'; then
              echo "::error::configure mode requires a valid $name address (got '$val')"
              exit 1
            fi
            echo "$name=$val" >> "$GITHUB_ENV"
            echo "$name=$val"
          done

      # ---- 5. Whitelist the vault on the dispatcher ------------------------
      - name: Whitelist vault on dispatcher (Base Sepolia)
        working-directory: v3-crosschain/base
        env:
          PRIVATE_KEY: ${{ secrets.V3_DEPLOYER_KEY }}
        run: |
          set -euo pipefail
          DISPATCHER_ADDRESS="$DISPATCHER" BASEDEMOVAULT_ADDRESS="$VAULT" \
            npx hardhat run scripts/whitelist-vault.js --network baseSepoliaTestnet

      # ---- 6. Register the dispatcher on the forwarder (zkSync) -----------
      - name: Register dispatcher as Base destination on forwarder (zkSync Sepolia)
        working-directory: v3-crosschain/boilerplate/smart-contracts
        env:
          PRIVATE_KEY: ${{ secrets.V3_DEPLOYER_KEY }}
        run: |
          set -euo pipefail
          BRIDGE_FORWARDER_ADDRESS="$FORWARDER" DST_EID=40245 DST_BRIDGE_ADDRESS="$DISPATCHER" \
            ACTION=set-bridge-address npx hardhat run scripts/configure.ts --network zkSyncSepoliaTestnet

      # ---- 7. Summary -------------------------------------------------------
      - name: Post-run summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## v3 EVM leg (testnet) — mode: ${{ github.event.inputs.mode }}

          | Role | Chain | Address |
          |------|-------|---------|
          | BridgeForwarder (hub) | zkSync Era Sepolia | \`$FORWARDER\` |
          | BaseTripDispatcher | Base Sepolia | \`$DISPATCHER\` |
          | BaseDemoVault | Base Sepolia | \`$VAULT\` |

          Wiring done: dispatcher trusts forwarder (EID 40305); vault whitelisted on
          dispatcher; forwarder \`bridgeAddresses[40245]\` = dispatcher.

          **Next (manual):** deploy the GenLayer leg on studio-dev pointed at
          \`$VAULT\`, then start the relay.
          EOF
